name: 'Rollcall: feature'
description: Work on Rollcall, linked to the wiki page that specifies it.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The wiki feature page is the spec. If this work changes what a feature should do, the PR that implements it updates the page.
        Feature index: https://github.com/wardmanm/rollcall_derby/blob/main/docs/features/README.md
  - type: input
    id: wiki-page
    attributes:
      label: Wiki feature page
      description: The page that specifies this work.
      placeholder: docs/features/team-builder.md
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements covered
      description: Requirement numbers from the feature page, or "new" if the page needs a new requirement.
      placeholder: R1, R3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that say when this is done.
      value: |
        - [ ]
    validations:
      required: true
