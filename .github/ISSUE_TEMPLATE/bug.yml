name: 'Rollcall: bug'
description: Something in Rollcall doesn't behave the way its wiki page says.
labels: ['bug']
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Where you saw the problem. rcl-core is the server and the admin app at /core/. rcl-producer is the Producer app at /producer/ and the OBS overlay.
      options:
        - rcl-core
        - rcl-producer
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The releases you're running (e.g. rcl-core-v0.1.0 and rcl-producer-v0.2.0), or "main".
    validations:
      required: true
  - type: input
    id: wiki-page
    attributes:
      label: Expected behavior is specified in
      description: Wiki page and requirement number, if there is one.
      placeholder: docs/features/live-mode.md R6
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
