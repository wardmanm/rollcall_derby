name: 'Rollcall: chore'
description: Maintenance with no user-visible change, such as dependencies, tooling, CI, refactoring or docs upkeep.
labels: ['chore']
body:
  - type: markdown
    attributes:
      value: |
        Chores don't change what users see, so they don't need a CHANGELOG line unless users would notice. If this changes how a feature behaves, use the feature or bug form instead.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Dependencies
        - Tooling / CI
        - Refactor
        - Docs / wiki
        - Other
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The rcl app this is for. Choose Both for repo-wide work such as CI or tooling. rcl-core is the server and the admin app at /core/. rcl-producer is the Producer app at /producer/ and the OBS overlay.
      options:
        - rcl-core
        - rcl-producer
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Optional. What prompted this, or what it unblocks.
  - type: input
    id: affected
    attributes:
      label: Affected files or wiki pages
      placeholder: scripts/check-docs.mjs, docs/wiki-guide.md
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable statements that say when this is done.
      value: |
        - [ ]
    validations:
      required: true
