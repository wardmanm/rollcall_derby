# Keeps the obs-producer wiki healthy: docs-lint tests, then the lint itself.
# What the lint checks: obs-producer/docs/wiki-guide.md#the-docs-lint
name: obs-producer docs

on:
  push:
    paths:
      - "obs-producer/**"
      - ".github/workflows/obs-producer-docs.yml"
  pull_request:
    paths:
      - "obs-producer/**"
      - ".github/workflows/obs-producer-docs.yml"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-producer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the docs lint
        run: node --test "scripts/*.test.mjs"
      - name: Lint the wiki
        run: node scripts/check-docs.mjs
